<meta name="theme-color" content="#0a0a0f">

          </button>
        </div>
        <div class="input-group">
          <input type="url" id="urlInput" class="url-input" placeholder="영어 / 한국어 기사 링크를 붙여넣으세요" autocomplete="url" autocorrect="off" spellcheck="false">
          <button id="snipBtn" class="snip-btn">Snip! ✂️</button>
        </div>
        <p class="input-hint">한국어 / 영어 기사만 지원합니다</p>
      </div>
    </section>

    <section id="loadingSection" class="section loading-section hidden">
      <div class="loading-content">
        <div class="spinner-ring"></div>
        <p class="loading-text" id="loadingText">기사를 읽고 있어요...</p>
        <div class="loading-steps" id="loadingSteps">
          <span class="step active" data-step="1">📡 페이지 불러오기</span>
          <span class="step" data-step="2">📄 내용 추출</span>
          <span class="step" data-step="3">✂️ 요약 생성</span>
        </div>
      </div>
    </section>

    <section id="errorSection" class="section error-section hidden">
      <div class="error-card" id="errorCard">
        <div class="error-icon-wrap">
          <span class="error-icon" id="errorIcon">⚠️</span>
        </div>
        <p class="error-title" id="errorTitle">오류가 발생했습니다</p>
        <p class="error-desc" id="errorDesc"></p>
        <button class="retry-btn" id="retryBtn">다시 시도</button>
      </div>
    </section>

    <section id="resultSection" class="section result-section hidden">
      <div class="result-header">
        <div class="article-meta">
          <h2 class="article-title" id="articleTitle"></h2>
          <span class="article-source" id="articleSource"></span>
        </div>
      </div>

      <div class="platform-tabs">
        <button class="platform-tab active" data-platform="twitter">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

      <div class="sns-preview" id="snsPreview">
        <div class="sns-card" id="snsCard">
          <div class="sns-card-header">
            <div class="sns-avatar">
              <span>✂️</span>
            </div>
            <div class="sns-user-info">
              <div class="sns-display-name">SnipLink</div>
              <div class="sns-username">@sniplink</div>
            </div>
            <div class="sns-more">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 12c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm9 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm7 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
            </div>
          </div>
          <div class="sns-card-body" id="snsCardBody">
            <p class="sns-summary-text">요약을 생성 중입니다...</p>
          </div>
          <div class="sns-card-footer">
            <div class="sns-actions-row">
              <button class="sns-action-btn" title="Reply">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              </button>
              <button class="sns-action-btn" title="Repost">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M7 23l-4-4 4-4"/><path d="M21 5H9a4 4 0 00-4 4v3M3 19h12a4 4 0 004-4v-3"/></svg>
              </button>
              <button class="sns-action-btn" title="Like">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
              </button>
              <button class="sns-action-btn" title="Share">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
              </button>
            </div>
            <div class="sns-timestamp" id="snsTimestamp">방금 전 · 0 조회</div>
          </div>
        </div>
      </div>

      <div class="summary-actions">
        <button class="action-btn btn-copy" id="copyBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          복사하기
        </button>
        <button class="action-btn btn-tweet" id="tweetBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

        <button class="action-btn btn-share" id="shareBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
          공유하기
        </button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>SnipLink — 완전 무료 · 서버 없는 브라우저 기반 요약</p>
      <p class="footer-small">✂️ 링크를 싹둑, SNS에 딱!</p>
    </div>
  </footer>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/detector.js"></script>
